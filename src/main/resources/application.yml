server:
  port: 8086

spring:
  application:
    name: ms-barriodigital-rabbitadmin
  rabbitmq:
    # failover del cliente (C8): en AWS RABBITMQ_ADDRESSES=10.0.1.254:5672,10.0.1.254:5673 (nodo 1 y 2).
    # Sin esa variable cae a host:port, asi que local no cambia.
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

barriodigital:
  security:
    issuer-uri: ${AAD_ISSUER_URI:https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0}
    audiences:
      # tokens v2.0 traen aud = GUID; v1.0 traen aud = api://GUID. Aceptar ambos.
      - ${AAD_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}
      - api://${AAD_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}
    required-scope: ${AAD_REQUIRED_SCOPE:access_as_user}
  rabbitadmin:
    # AMQP 0-9-1 no tiene operacion de "listar colas": enumerar es cosa del plano
    # HTTP de management, no del protocolo. GET /admin/queues sin ?names inspecciona
    # esta lista; con ?names=a,b inspecciona las que le pidas. Ver README.
    colas-conocidas:
      - q.cmd.email
      - q.cmd.email.dlq
      - q.cmd.crew
      - q.cmd.crew.dlq
      - q.cmd.certificate
      - q.cmd.certificate.dlq

management:
  endpoints:
    web:
      exposure:
        include: health
